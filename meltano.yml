send_anonymous_usage_stats: true
project_id: "tap-revcrm"
default_environment: test
requires_meltano: ">=4.0"
environments:
- name: test
plugins:
  extractors:
  - name: "tap-revcrm"
    namespace: "tap_revcrm"
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging

    settings:
    - name: client_id
      label: Client ID
      description: Auth0 machine-to-machine application client ID
    - name: client_secret
      label: Client Secret
      description: Auth0 machine-to-machine application client secret
      sensitive: true
    - name: client_code
      label: Client Code
      description: RevCRM client database code
    - name: search_parameters
      kind: object
      label: Donor Search Parameters
      description: At least one RevCRM donor search criterion
    settings_group_validation:
    - [client_id, client_secret, client_code, search_parameters]

    config:
      api_url: https://app.roicrm.net/api/1.0

  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
